name: Phase 0 through 2 quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify with CockroachDB ${{ matrix.cockroach-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cockroach-version: [25.4.4, 26.2.2]
    env:
      APP_ENV: test
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://synthetic:synthetic@localhost:26257/test
      MIGRATION_DATABASE_URL: postgresql://synthetic_migration:synthetic@localhost:26257/test?options=-c%20create_table_with_schema_locked%3Doff
      BETTER_AUTH_SECRET: synthetic-ci-secret-that-is-at-least-32-characters
      PII_ENCRYPTION_ACTIVE_VERSION: 1
      PII_ENCRYPTION_KEY_V1: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      PHONE_LOOKUP_HMAC_ACTIVE_VERSION: 1
      PHONE_LOOKUP_HMAC_KEY_V1: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
      RATE_LIMIT_HMAC_KEY: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install CockroachDB test binary
        run: |
          curl -fsSLO https://binaries.cockroachdb.com/cockroach-v${{ matrix.cockroach-version }}.linux-amd64.tgz
          curl -fsSLO https://binaries.cockroachdb.com/cockroach-v${{ matrix.cockroach-version }}.linux-amd64.tgz.sha256sum
          sha256sum --check cockroach-v${{ matrix.cockroach-version }}.linux-amd64.tgz.sha256sum
          tar -xzf cockroach-v${{ matrix.cockroach-version }}.linux-amd64.tgz
          echo "$PWD/cockroach-v${{ matrix.cockroach-version }}.linux-amd64" >> "$GITHUB_PATH"
      - run: pnpm verify
